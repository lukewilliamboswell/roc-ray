name: Install the RocRay toolchain
description: >-
  Install Zig 0.17.1 and the Roc nightly this run resolved once, in its first
  job, and report the compiler.

inputs:
  nightly-tag:
    description: The roc-lang/nightlies tag the run's first job resolved
    required: true
  zig:
    description: Also install Zig (jobs that only run a bundled platform do not need it)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Blueprint and cache verified binaries
      uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@6c796f299012707d2e9bad23fd6449ed93f1f475
      with:
        cache-binary: "true"
        cache: "true"
        cache-workload: roc-${{ inputs.nightly-tag }}

    - if: inputs.zig == 'true'
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.17.1

    # The platform names no compiler: every job of a run installs the one
    # nightly that run resolved, so one run never mixes compilers.
    - name: Download the workflow's compiler manifest
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: roc-toolchain-${{ inputs.nightly-tag }}
        path: ${{ runner.temp }}/roc-toolchain

    - name: Install Roc
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ROC_NIGHTLY: ${{ inputs.nightly-tag }}
      run: >-
        python3 "$GITHUB_ACTION_PATH/../../../scripts/setup_roc_blueprint.py"
        --nightly "$ROC_NIGHTLY"
        --directory "$RUNNER_TEMP/roc-toolchain"
        --github-path "$GITHUB_PATH"

    - name: Report the compiler
      shell: bash
      run: echo "Using $(roc version) ($(command -v roc))"
