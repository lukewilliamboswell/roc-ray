name: Install the RocRay toolchain
description: >-
  Install Zig 0.17.1 and the Roc nightly this run resolved once, in its first
  job, and report the compiler.

inputs:
  nightly-tag:
    description: The roc-lang/nightlies tag the run's first job resolved
    required: true
  zig:
    description: Also install Zig (jobs that only run a bundled platform do not need it)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - if: inputs.zig == 'true'
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.17.1

    # The platform names no compiler: every job of a run installs the one
    # nightly that run resolved, so one run never mixes compilers.
    - name: Install Roc
      uses: roc-lang/setup-roc@30af91a173612e462a5df47f3b697c53c211f48c
      with:
        version: nightly-new-compiler
        download-method: asset-api
        nightly-tag: ${{ inputs.nightly-tag }}

    - name: Report the compiler
      shell: bash
      run: echo "Using $(roc version) ($(command -v roc))"
