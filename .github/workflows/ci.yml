name: Windows compiler mode comparison

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6ea154972aca7c327c215aa833fcf6f0712e5ca5
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: nightly-2026-11-11-7679cc5
          zig: "false"
      - name: Download the exact diagnostic compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 43152950401 --repo "${{ github.repository }}" -n windows-compiler-root-diagnostics -D .compiler-artifact
      - name: Compare official and diagnostic compilers
        run: |
          diagnostic_roc="$PWD/.compiler-artifact/roc-ray/roc-ray/compiler-debug/zig-out/bin/roc.exe"
          roc version
          "$diagnostic_roc" version
          log_dir="$RUNNER_TEMP/compiler-comparison"
          mkdir -p "$log_dir"
          overall=0
          for mode in official diagnostic diagnostic-traced; do
            unset ROC_TRACE_BOXY_WORK ROC_CTFE_DEMAND_TRACE
            compiler="$(command -v roc)"
            if [ "$mode" != official ]; then compiler="$diagnostic_roc"; fi
            if [ "$mode" = diagnostic-traced ]; then
              export ROC_TRACE_BOXY_WORK=1 ROC_CTFE_DEMAND_TRACE=1
            fi
            passed=0
            result=0
            for pass in {1..20}; do
              echo "$mode: uncached Breakout pass $pass"
              trace_log="$log_dir/$mode-$pass.log"
              if "$compiler" test --no-cache examples/breakout/main.roc > "$trace_log" 2>&1; then
                passed=$((passed + 1))
                tail -3 "$trace_log"
              else
                result=$?
                overall=1
                tail -80 "$trace_log"
                break
              fi
            done
            echo "$mode: $passed passes; first failure exit=$result" >> "$log_dir/summary.txt"
          done
          cat "$log_dir/summary.txt"
          exit "$overall"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-compiler-mode-comparison
          path: ${{ runner.temp }}/compiler-comparison/
