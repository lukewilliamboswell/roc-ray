name: CI

on:
  pull_request:

jobs:
  # Pixel-level rendering and capture checks. They need a real GL context, so
  # they run under a virtual display -- without this the target never runs
  # anywhere, which is how it sat unrun for so long.
  #
  # Deliberately outside the build matrix. This is the only thing here that
  # links the system libc directly (`-lc`), and the vendored raylib references
  # glibc 2.38's `__isoc23_*` symbols, which ubuntu-22.04 does not provide. The
  # platform and the examples are unaffected: they link through the generated
  # libc stub instead.
  graphical-smoke:
    name: Graphical smoke tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      # Xvfb provides the display; the X11 dev packages are what raylib links
      # against, and mesa's software rasteriser is what gives xvfb a GL context.
      - name: Install X11 and GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev libglx-mesa0 mesa-utils

      - name: Run graphical smoke tests
        run: xvfb-run -a zig build graphical-smoke

  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15         # arm64mac
          - ubuntu-22.04     # x64glibc
          - windows-2022     # x64win
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Build platform
        run: zig build

      - name: Run Zig tests
        # Native tests require MSVC libraries on Windows which aren't available in CI
        if: runner.os != 'Windows'
        run: zig build test -Droc-tests=false

      # Checks each vendored libvpx SIMD kernel against its C reference. It has
      # to run on the target -- macos-15 is arm64, and NEON is where an arm64
      # build replaces ~200 kernels that nothing else here would exercise.
      # `zig build test` already depends on this; naming it separately makes a
      # kernel mismatch obvious in the job list rather than buried in the tests.
      - name: Check libvpx SIMD parity
        if: runner.os != 'Windows'
        run: zig build libvpx-parity

      - name: Test Wayland bundle package
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import scripts.all_tests as tests

          root = Path(".").resolve()
          failures = tests.run_wayland_bundle_test(root, root / "examples/hello_world/main.roc", False)
          if failures:
              for failure in failures:
                  print(f"FAILED: {failure}")
              raise SystemExit(1)
          PY

      # all_tests.py bundles the types package and the platform itself, serves
      # them on a loopback port, and builds copies of the examples that point at
      # the served URLs. It used to take three steps here to bundle, serve on a
      # fixed port 8000, and rewrite the checked-in example headers in place.
      # --platform-mode=bundle makes bundling mandatory, so a host that cannot
      # bundle fails loudly instead of quietly falling back to building the
      # examples against the platform sources.
      - name: Run Roc check/fmt/test
        # Skip on Windows - roc executable PATH issues and MSVC requirements
        if: runner.os != 'Windows'
        run: scripts/all_tests.py --skip-platform-build --skip-roc-build --skip-bundle-test --platform-mode=bundle

      # Headless mode exists so every platform can build and run its examples
      # without a display, so run it on every platform. Linking is also what
      # catches a host library missing a definition: a static archive does not
      # complain about an unresolved reference, so a build can look clean on all
      # four targets and still fail in every app that links it.
      #
      # Bounded because a headless run that hangs would otherwise sit until the
      # six-hour job limit.
      - name: Build and run examples headlessly
        timeout-minutes: 20
        run: scripts/all_tests.py --skip-platform-build --runtime-only --skip-bundle-test --platform-mode=bundle
