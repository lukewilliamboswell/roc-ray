name: CI

on:
  pull_request:

jobs:
  # Pixel-level rendering and capture checks. They need a real GL context, so
  # they run under a virtual display -- without this the target never runs
  # anywhere, which is how it sat unrun for so long.
  #
  # Deliberately outside the build matrix. This is the only thing here that
  # links the system libc directly (`-lc`), and the vendored raylib references
  # glibc 2.38's `__isoc23_*` symbols, which ubuntu-22.04 does not provide. The
  # platform and the examples are unaffected: they link through the generated
  # libc stub instead.
  graphical-smoke:
    name: Graphical smoke tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      # Xvfb provides the display; the X11 dev packages are what raylib links
      # against, and mesa's software rasteriser is what gives xvfb a GL context.
      - name: Install X11 and GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libx11-dev libxcursor-dev libxext-dev \
            libxfixes-dev libxi-dev libxinerama-dev libxrandr-dev \
            libgl1-mesa-dev libglx-mesa0 mesa-utils

      - name: Run graphical smoke tests
        run: xvfb-run -a zig build graphical-smoke

  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15         # arm64mac
          - ubuntu-22.04     # x64glibc
          - windows-2022     # x64win
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Build platform
        run: zig build

      - name: Run Zig tests
        # Native tests require MSVC libraries on Windows which aren't available in CI
        if: runner.os != 'Windows'
        run: zig build test -Droc-tests=false

      # Checks each vendored libvpx SIMD kernel against its C reference. It has
      # to run on the target -- macos-15 is arm64, and NEON is where an arm64
      # build replaces ~200 kernels that nothing else here would exercise.
      # `zig build test` already depends on this; naming it separately makes a
      # kernel mismatch obvious in the job list rather than buried in the tests.
      - name: Check libvpx SIMD parity
        if: runner.os != 'Windows'
        run: zig build libvpx-parity

      - name: Bundle platform
        run: |
          # The platform depends on roc-ray-types by relative path, which cannot
          # survive bundling, so pass the URL the package will be served from
          # below. Port 8000 matches the HTTP server step.
          output="$(scripts/bundle.sh --types-url-base http://127.0.0.1:8000)"
          echo "$output"
          # Basename of the `Created:` path; Git Bash on Windows reports
          # backslash separators, so strip either.
          platform_bundle="$(printf '%s\n' "$output" | sed -n 's|^Created: ||p' | tail -1 | sed 's|.*[/\\]||')"
          if [ -z "$platform_bundle" ]; then
            echo "Error: could not determine the platform bundle filename"
            exit 1
          fi
          echo "PLATFORM_BUNDLE=$platform_bundle" >> "$GITHUB_ENV"

      - name: Test Wayland bundle package
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          import scripts.all_tests as tests

          root = Path(".").resolve()
          failures = tests.run_wayland_bundle_test(root, root / "examples/hello_world.roc", False)
          if failures:
              for failure in failures:
                  print(f"FAILED: {failure}")
              raise SystemExit(1)
          PY

      - name: Start HTTP server for bundle
        run: |
          # Two archives are produced now (platform and roc-ray-types), so use
          # the name captured at bundle time rather than picking one by glob.
          BUNDLE_FILE="$PLATFORM_BUNDLE"
          if [ -z "$BUNDLE_FILE" ] || [ ! -f "$BUNDLE_FILE" ]; then
            echo "Error: platform bundle '$BUNDLE_FILE' not found"
            exit 1
          fi

          BUNDLE_URL="http://127.0.0.1:8000/$BUNDLE_FILE"
          python3 -m http.server --bind 127.0.0.1 8000 &
          SERVER_PID=$!

          for attempt in {1..30}; do
            if curl -sf "$BUNDLE_URL" -o /dev/null; then
              echo "Bundle accessible at $BUNDLE_URL"
              echo "BUNDLE_URL=$BUNDLE_URL" >> "$GITHUB_ENV"
              exit 0
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Error: HTTP server exited before serving $BUNDLE_FILE"
              exit 1
            fi

            sleep 1
          done

          echo "Error: Bundle not accessible at $BUNDLE_URL"
          curl -v "$BUNDLE_URL" -o /dev/null || true
          exit 1

      - name: Update examples to use bundled platform
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from scripts.all_tests import _rewrite_platform_ref

          replacement = f'"{os.environ["BUNDLE_URL"]}"'
          for example in sorted(Path("examples").glob("*.roc")):
              original = example.read_text()
              rewritten, did_rewrite = _rewrite_platform_ref(original, replacement)
              if did_rewrite:
                  print(f"Updating: {example}")
                  example.write_text(rewritten)
              else:
                  print(f"Skipping: {example} (no platform reference)")
          PY

      - name: Run Roc check/fmt/test
        # Skip on Windows - roc executable PATH issues and MSVC requirements
        if: runner.os != 'Windows'
        run: scripts/all_tests.py --skip-platform-build --skip-roc-build --skip-bundle-test

      # Link every example without running it. Linux runs them for real in the
      # next step; macOS cannot, because generated executables hang there. But
      # *linking* is what catches a host library that is missing a definition --
      # a static archive does not complain about an unresolved reference, so a
      # build can be clean on all four targets and still fail in every app.
      # An arm64-only miss reached the release bundle test before this existed.
      - name: Build examples
        if: runner.os == 'macOS'
        run: scripts/all_tests.py --skip-platform-build --skip-roc-test --skip-runtime --skip-bundle-test

      - name: Build and run examples headlessly
        # Linux covers headless runtime; macOS currently hangs in generated executables
        # and Windows has roc executable PATH issues plus MSVC requirements.
        if: runner.os == 'Linux'
        run: scripts/all_tests.py --skip-platform-build --runtime-only --skip-bundle-test
