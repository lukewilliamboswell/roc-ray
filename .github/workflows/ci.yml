name: Windows literal wall probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literal-wall:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: nightly-2026-11-11-7679cc5
          zig: "false"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 6ea154972aca7c327c215aa833fcf6f0712e5ca5
          path: baseline
          persist-credentials: false
      - name: Compare the original and literal walls
        run: |
          roc version
          log_dir="$RUNNER_TEMP/literal-wall-probe"
          mkdir -p "$log_dir"
          overall=0
          for mode in baseline literal; do
            app=examples/breakout/main.roc
            limit=100
            if [ "$mode" = baseline ]; then
              app=baseline/examples/breakout/main.roc
              limit=20
            fi
            passed=0
            result=0
            for ((pass=1; pass<=limit; pass++)); do
              trace_log="$log_dir/$mode-$pass.log"
              echo "$mode: uncached Breakout pass $pass"
              if roc test --no-cache "$app" > "$trace_log" 2>&1; then
                passed=$((passed + 1))
                tail -3 "$trace_log"
              else
                result=$?
                overall=1
                cat "$trace_log"
                break
              fi
            done
            echo "$mode: $passed passes; first failure exit=$result" >> "$log_dir/summary.txt"
          done
          cat "$log_dir/summary.txt"
          exit "$overall"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-literal-wall-probe
          path: ${{ runner.temp }}/literal-wall-probe/
