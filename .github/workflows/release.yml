name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.8.0"
        required: true
        type: string
      previous_release_url:
        description: "Previous default bundle URL for roc bump; empty resolves from latest release notes"
        required: false
        default: ""
        type: string
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Build release bundles
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" != "branch" ]]; then
            echo "Release workflow must be run from a branch so generated docs can be opened as a follow-up PR."
            exit 1
          fi

      - name: Build platform
        run: zig build -Doptimize=ReleaseFast

      - name: Run Zig tests
        run: zig build test -Droc-tests=false

      - name: Validate Roc examples and docs
        run: |
          scripts/all_tests.py --skip-platform-build --skip-roc-build --skip-bundle-test
          python3 scripts/build_docs.py --check

      - name: Verify release hosts
        run: scripts/check_release_hosts.py

      - name: Resolve previous default bundle
        if: github.event_name == 'workflow_dispatch'
        id: previous
        run: |
          python3 scripts/release_helpers.py resolve-previous-default-url \
            --provided-url "${{ inputs.previous_release_url }}" \
            --repo "${{ github.repository }}" \
            --output-file .release/previous-url.txt \
            --github-output "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          # Keep this advisory until the Roc compiler reaches 0.1.0.
          bump_check: ${{ steps.previous.outputs.bump_check || 'warn' }}
          bump_entrypoint: platform/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Ensure release metadata files exist
        run: touch .release/previous-url.txt

      - name: Bundle platform packages
        id: bundle
        run: |
          mkdir -p dist

          # The platform depends on roc-ray-types by relative path so local
          # development needs no published artifact. That cannot survive
          # bundling, so bundle.sh bundles the package too and rewrites the
          # staged header to the URL it will live at. We know that URL ahead of
          # time because it is this release's own download base -- the same one
          # the release notes use.
          types_url_base="https://github.com/${{ github.repository }}/releases/download/${{ steps.validate.outputs.release_version }}"

          default_output="$(scripts/bundle.sh --platform default --output-dir dist --types-url-base "$types_url_base")"
          echo "$default_output"
          default_bundle="$(printf '%s\n' "$default_output" | awk '/^Created:/ {print $2}' | tail -1)"
          if [[ -z "$default_bundle" || ! -f "$default_bundle" ]]; then
            echo "Error: could not determine default bundle filename"
            exit 1
          fi

          types_bundle_name="$(printf '%s\n' "$default_output" | sed -n 's|^Types package bundle: ||p' | tail -1)"
          types_bundle="dist/$types_bundle_name"
          if [[ -z "$types_bundle_name" || ! -f "$types_bundle" ]]; then
            echo "Error: could not determine roc-ray-types bundle filename"
            exit 1
          fi

          wayland_output="$(scripts/bundle.sh --platform wayland --output-dir dist --types-url-base "$types_url_base")"
          echo "$wayland_output"
          wayland_bundle="$(printf '%s\n' "$wayland_output" | awk '/^Created:/ {print $2}' | tail -1)"
          if [[ -z "$wayland_bundle" || ! -f "$wayland_bundle" ]]; then
            echo "Error: could not determine Wayland bundle filename"
            exit 1
          fi

          echo "default_bundle=$default_bundle" >> "$GITHUB_OUTPUT"
          echo "wayland_bundle=$wayland_bundle" >> "$GITHUB_OUTPUT"
          echo "types_bundle=$types_bundle" >> "$GITHUB_OUTPUT"
          echo "types_url=$types_url_base/$types_bundle_name" >> "$GITHUB_OUTPUT"

      - name: Write bundle test manifest
        run: |
          python3 scripts/release_helpers.py write-bundle-manifest \
            --default-bundle "${{ steps.bundle.outputs.default_bundle }}" \
            --wayland-bundle "${{ steps.bundle.outputs.wayland_bundle }}" \
            --output .release/bundle-manifest.json

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          bundle_glob: dist/*.tar.zst
          bundle_manifest_path: .release/bundle-manifest.json

      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test ${{ matrix.bundle_name }} bundle (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Test release bundle
        uses: roc-lang/release-package/actions/test-bundle@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          test_bundle_command: scripts/test_bundle_artifact.py
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build.outputs.release_version }}

  publish-release:
    name: Publish GitHub release
    needs:
      - build
      - test-bundles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.build.outputs.docs_version }}/
          release_notes_command: python3 scripts/release_helpers.py make-release-notes --release-version "$RELEASE_VERSION" --release-bundles "$RELEASE_BUNDLES_PATH" --output-file "$RELEASE_NOTES_PATH" --docs-url "$DOCS_URL"
          github_token: ${{ github.token }}

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}

  publish-docs:
    name: Publish versioned docs
    needs:
      - build
      - publish-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Roc version
        run: printf 'ROC_NIGHTLY_TAG=%s\n' "$(sed -n '1p' .roc-version)" >> "$GITHUB_ENV"

      - name: Install Roc
        uses: roc-lang/setup-roc@cbe782d6f165b89c87d99f50a59ac4f5f73b4427
        with:
          version: nightly-new-compiler
          nightly-tag: ${{ env.ROC_NIGHTLY_TAG }}

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .release

      - name: Update example bundle URLs
        run: |
          python3 scripts/release_helpers.py update-example-urls \
            --release-version "${{ needs.build.outputs.release_version }}" \
            --release-bundles .release/release-bundles.json \
            --examples-dir examples

      - name: Snapshot existing docs
        uses: roc-lang/release-package/actions/docs-snapshot@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www

      # Builds the platform docs and, nested under them at `types/`, the
      # roc-ray-types package docs. Both are needed: `roc docs` attaches a
      # nominal's receivers to the module that declares it, so the platform's
      # re-export modules carry the signatures but not the receivers.
      - name: Generate docs
        run: python3 scripts/build_docs.py --version "${{ needs.build.outputs.docs_version }}"

      - name: Update docs index
        uses: roc-lang/release-package/actions/docs-index@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www
          docs_version: ${{ needs.build.outputs.docs_version }}

      - name: Validate docs
        uses: roc-lang/release-package/actions/docs-validate@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          docs_root: www
          docs_version: ${{ needs.build.outputs.docs_version }}

      - name: Open release follow-up PR
        uses: roc-lang/release-package/actions/create-followup-pr@d2560ead9f724bfaabfbc8134b8895e120171064
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          paths: www examples
          branch_prefix: release-followup
          base_branch: ${{ github.ref_name }}
          commit_message: Update release references for ${{ needs.build.outputs.release_version }}
          pr_title: Update release references for ${{ needs.build.outputs.release_version }}
          github_token: ${{ github.token }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
