name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version, e.g. 0.8.0"
        required: false
        type: string
      previous_release_url:
        description: "Previous default bundle URL for roc bump; empty resolves from latest release notes"
        required: false
        default: ""
        type: string
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # The platform names no compiler. A release is built and tested with the
  # latest nightly, resolved once here and installed by every job, so the
  # bundles, their tests and the release notes all name one compiler.
  resolve:
    name: Resolve the latest Roc nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      nightly-tag: ${{ steps.nightly.outputs.tag }}
    steps:
      - id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh api repos/roc-lang/nightlies/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"

  build:
    name: Build release bundles
    needs: resolve
    runs-on: ubuntu-latest
    env:
      ROC_RAY_DEPENDENCY_CACHE: ${{ github.workspace }}/../roc-ray-dependencies
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}

      - name: Verify locked macOS interface attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_attestations.py dependencies.lock.json --cache "$ROC_RAY_DEPENDENCY_CACHE"

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          github_token: ${{ github.token }}

      - name: Validate release branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" != "branch" ]]; then
            echo "Release workflow must be run from a branch, normally main."
            exit 1
          fi

      # Linker inputs come from the release locked by link-inputs.lock.json.
      # The cache only saves a download: every use rehashes the archives
      # against the lock, and nothing here can rebuild them.
      - name: Restore locked linker inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/roc-ray/link-inputs
          key: link-inputs-${{ hashFiles('link-inputs.lock.json') }}

      # Publication bundles only inputs whose GitHub build provenance names
      # the locked producer workflow, source commit, and ref.
      - name: Verify linker-input attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/link_inputs.py verify-attestations

      # The host records the nightly it was built for in Observatory metadata.
      - name: Build platform
        env:
          NIGHTLY_TAG: ${{ needs.resolve.outputs.nightly-tag }}
        run: zig build -Doptimize=ReleaseFast -Droc-compiler="$NIGHTLY_TAG"

      - name: Run Zig tests
        run: zig build test -Droc-tests=false

      - name: Validate Roc examples
        run: |
          # The examples are checked against a locally bundled and served
          # platform, which is the shape they will be released in; bundle mode
          # is mandatory here rather than falling back to the platform sources.
          scripts/all_tests.py --skip-platform-build --skip-roc-build --skip-bundle-test --platform-mode=bundle
          # Keep the largest 3D consumer honest through native linking and the
          # headless host too. This catches a generated re-export or hosted
          # symbol omitted from the publishable package.
          scripts/all_tests.py --only roc-doom-e1m1 --skip-platform-build --skip-roc-test \
            --skip-bundle-test --skip-integration-probes \
            --platform-mode=bundle --skip-windowed --headless-frames=3

      - name: Verify release hosts
        run: scripts/check_release_hosts.py

      - name: Resolve previous default bundle
        if: github.event_name == 'workflow_dispatch'
        id: previous
        run: |
          python3 scripts/release_helpers.py resolve-previous-default-url \
            --provided-url "${{ inputs.previous_release_url }}" \
            --repo "${{ github.repository }}" \
            --output-file .release/previous-url.txt \
            --github-output "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ github.event_name != 'workflow_dispatch' }}
          # Keep this advisory until the Roc compiler reaches 0.1.0.
          bump_check: ${{ steps.previous.outputs.bump_check || 'warn' }}
          bump_entrypoint: platform/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Ensure release metadata files exist
        run: touch .release/previous-url.txt

      - name: Bundle platform packages
        id: bundle
        run: |
          mkdir -p dist

          default_output="$(scripts/bundle.sh --platform default --output-dir dist)"
          echo "$default_output"
          default_bundle="$(printf '%s\n' "$default_output" | awk '/^Created:/ {print $2}' | tail -1)"
          if [[ -z "$default_bundle" || ! -f "$default_bundle" ]]; then
            echo "Error: could not determine default bundle filename"
            exit 1
          fi

          wayland_output="$(scripts/bundle.sh --platform wayland --output-dir dist)"
          echo "$wayland_output"
          wayland_bundle="$(printf '%s\n' "$wayland_output" | awk '/^Created:/ {print $2}' | tail -1)"
          if [[ -z "$wayland_bundle" || ! -f "$wayland_bundle" ]]; then
            echo "Error: could not determine Wayland bundle filename"
            exit 1
          fi

          echo "default_bundle=$default_bundle" >> "$GITHUB_OUTPUT"
          echo "wayland_bundle=$wayland_bundle" >> "$GITHUB_OUTPUT"

      - name: Write bundle test manifest
        run: |
          python3 scripts/release_helpers.py write-bundle-manifest \
            --default-bundle "${{ steps.bundle.outputs.default_bundle }}" \
            --wayland-bundle "${{ steps.bundle.outputs.wayland_bundle }}" \
            --output .release/bundle-manifest.json

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          bundle_glob: dist/*.tar.zst
          bundle_manifest_path: .release/bundle-manifest.json

      # Dry-run cover for the asset the publish job attaches. A pull request
      # never reaches `publish-release`, so without this a broken example
      # header or a new example directory would only be found mid-release.
      # The URL is a placeholder and the archive is thrown away.
      - name: Check the examples archive can be built
        run: |
          python3 scripts/release_helpers.py package-examples \
            --bundle-url "https://github.com/${{ github.repository }}/releases/download/0.0.0/dry-run.tar.zst" \
            --tag dry-run \
            --output .release/examples-dry-run.zip
          rm -f .release/examples-dry-run.zip

      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
          if-no-files-found: error
          retention-days: 7

  # Every release carries its own documentation: the manual as a static site
  # and as a PDF, with the `roc docs` API reference beside it, and Pages shows
  # the same build. It is built here, read-only, for a pull request too, so a
  # broken manual or API reference fails before a release is attempted; only
  # the publish jobs use what it uploads.
  build-docs:
    name: Build the documentation
    needs:
      - resolve
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `roc docs` generates the API reference; the platform names no
      # compiler, so it is the nightly this release is built with.
      - name: Install the compiler
        uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
          zig: "false"

      # Blueprint downloads roc-docs and checks its bytes against the digest
      # Blueprint.lock records before handing out the path.
      - name: Set up Blueprint
        uses: lukewilliamboswell/roc-automation/actions/setup-blueprint@7aff4132691ad4fc348abe9df146a57512b49bd6

      - id: renderer
        name: Get the verified renderer
        run: echo "path=$(blueprint run docs-renderer)" >> "$GITHUB_OUTPUT"

      - name: Check the prepared images
        run: python3 scripts/prepare_docs_images.py

      - id: manual
        name: Build the manual
        uses: lukewilliamboswell/roc-automation/actions/build-docs@7aff4132691ad4fc348abe9df146a57512b49bd6
        with:
          renderer-binary: ${{ steps.renderer.outputs.path }}
          pdf-filename: roc-ray.pdf
          site-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          docs-version: ${{ needs.build.outputs.release_version }}

      # Not the action's `api-entrypoint`: build_docs.py also hides the
      # compiler-required private adapter entries from the reference and
      # checks every effect's phase sentence, which plain `roc docs` does not.
      - name: Build the API reference
        env:
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
        run: python3 scripts/build_docs.py --docs-root .docs-api --version "$DOCS_VERSION"

      - name: Package the documentation
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
          SITE: ${{ steps.manual.outputs.site-directory }}
          PDF: ${{ steps.manual.outputs.pdf-path }}
        run: |
          python3 scripts/release_helpers.py package-docs \
            --release-version "$RELEASE_VERSION" \
            --manual "$SITE" \
            --api ".docs-api/$DOCS_VERSION" \
            --pdf "$PDF" \
            --output-dir .release/docs
          # Pages shows the current release only: the manual at the root and
          # the API reference under api/. Each release carries its own copy
          # of both as attached assets, so nothing old accumulates there.
          python3 scripts/release_helpers.py assemble-pages \
            --manual "$SITE" \
            --api ".docs-api/$DOCS_VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --output .pages

      - name: Upload the documentation assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-docs
          path: .release/docs/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .pages
          retention-days: 7

  test-bundles:
    name: Test ${{ matrix.bundle_name }} bundle (${{ matrix.os }})
    needs:
      - resolve
      - build
    runs-on: ${{ matrix.os }}
    env:
      # Exercise every bundled example without entering this nightly's
      # resource-heavy LLVM speed pipeline on hosted runners.
      ROC_BUILD_OPT: dev
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the compiler
        uses: ./.github/actions/setup-toolchain
        with:
          nightly-tag: ${{ needs.resolve.outputs.nightly-tag }}
          zig: "false"

      - name: Download release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Test release bundle
        uses: roc-lang/release-package/actions/test-bundle@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          test_bundle_command: scripts/test_bundle_artifact.py ${{ github.event_name == 'pull_request' && '--port 8765' || '' }}
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build.outputs.release_version }}

  required:
    name: Release required
    if: always()
    needs:
      - resolve
      - build
      - build-docs
      - test-bundles
    runs-on: ubuntu-latest
    steps:
      - name: Require release validation
        env:
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DOCS_RESULT: ${{ needs.build-docs.result }}
          BUNDLES_RESULT: ${{ needs.test-bundles.result }}
        run: test "$RESOLVE_RESULT" = success && test "$BUILD_RESULT" = success && test "$DOCS_RESULT" = success && test "$BUNDLES_RESULT" = success

  publish-release:
    name: Publish GitHub release
    needs:
      - resolve
      - build
      - build-docs
      - test-bundles
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: .release

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          release_notes_command: python3 scripts/release_helpers.py make-release-notes --release-version "$RELEASE_VERSION" --release-bundles "$RELEASE_BUNDLES_PATH" --output-file "$RELEASE_NOTES_PATH" --docs-url "$DOCS_URL" --notes-dir docs/releases --roc-version "${{ needs.resolve.outputs.nightly-tag }}"
          github_token: ${{ github.token }}

      # The examples are packaged with their headers pointing at the default
      # bundle URL this release is about to publish, so an unzipped copy builds
      # without any local platform checkout.
      - name: Package examples archive
        run: |
          python3 scripts/release_helpers.py package-examples \
            --release-version "${{ needs.build.outputs.release_version }}" \
            --release-bundles .release/release-bundles.json \
            --repo "${{ github.repository }}" \
            --output ".release/examples-${{ needs.build.outputs.release_version }}.zip"

      - name: Download the documentation assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-docs
          path: .release

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@af2f0cd8662874b825ff3917f4286e793ba18c55
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          additional_assets: |
            .release/examples-${{ needs.build.outputs.release_version }}.zip
            .release/roc-ray-docs-${{ needs.build.outputs.release_version }}.zip
            .release/roc-ray-${{ needs.build.outputs.release_version }}.pdf
          github_token: ${{ github.token }}

  # Deploys the site build-docs assembled; it checks out and builds nothing.
  publish-docs:
    name: Publish the docs
    needs:
      - build-docs
      - publish-release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
