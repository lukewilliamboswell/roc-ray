name: Update Roc nightly
on:
  schedule:
    # Once daily, about four hours after the upstream 09:00 UTC build.
    - cron: "40 13 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: roc-nightly-update
  cancel-in-progress: false
jobs:
  update:
    # Ceiling only: the reusable workflow narrows permissions per job.
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    uses: lukewilliamboswell/roc-automation/.github/workflows/update-roc-nightly.yml@1c26abc3dda359c5c031303563167bfa43ad6e32
